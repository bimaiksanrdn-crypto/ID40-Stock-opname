<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID40 Stock Opname :: HEX-TECH HUD</title>
<style>
/* Reset & Base */
* { box-sizing: border-box; }
body {
  margin: 0;
  /* Font futuristik/kaku ala UI game */
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  /* Latar belakang gelap pekat dengan pola grid Cyberpunk */
  background-color: #050509;
  background-image: 
    linear-gradient(0deg, rgba(0, 20, 40, 0.2) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 20, 40, 0.2) 1px, transparent 1px);
  background-size: 20px 20px;
  color: #c0eaeb; /* Cyan pucat */
  overflow-x: hidden;
}

/* Header - Diubah total jadi HUD top bar */
header {
  background: rgba(10, 15, 25, 0.9);
  color: #00ffff; /* Pure Cyan neon */
  padding: 15px 25px;
  border-bottom: 2px solid #00ffff;
  box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}
/* Efek Scanline pada Header */
header::after {
  content: "";
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
  background-size: 100% 4px;
  z-index: 1;
  pointer-events: none;
}
header h2 { 
  margin: 0; 
  font-size: 22px; 
  text-transform: uppercase; 
  letter-spacing: 2px;
  font-weight: 900;
  text-shadow: 0 0 10px #00ffff;
}
header p { margin: 0; font-size: 12px; opacity: 0.8; letter-spacing: 1px;}

/* Main Container */
main {
  max-width: 950px;
  margin: auto;
  padding: 20px;
  position: relative;
}

/* Kotak (Card) - Menjadi Hextech Panel */
.card {
  background: rgba(15, 20, 30, 0.8);
  /* Sudut tajam/terpotong diagonal ala LoL UI */
  border: 1px solid #1a2a4a;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: inset 0 0 10px rgba(0, 100, 255, 0.1), 0 5px 15px rgba(0,0,0,0.5);
  transition: border-color 0.3s, box-shadow 0.3s;
}
.card:hover {
  border-color: #007bff; /* Electric Blue saat hover */
  box-shadow: inset 0 0 15px rgba(0, 100, 255, 0.2), 0 5px 20px rgba(0,0,0,0.6);
}

h3 { 
  margin-top: 0; 
  color: #00ffff; 
  text-transform: uppercase; 
  letter-spacing: 1.5px; 
  font-size: 18px;
  border-bottom: 1px solid rgba(0, 255, 255, 0.3);
  padding-bottom: 8px;
  margin-bottom: 15px;
  text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
}

/* Input & Select - HUD style */
input, select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  background-color: rgba(5, 10, 20, 0.7);
  border: 1px solid #1a2a4a;
  border-radius: 0; /* Tajam */
  color: #00ffff;
  font-size: 15px;
  transition: border-color 0.3s, box-shadow 0.3s;
}
input:focus, select:focus {
  outline: none;
  border-color: #00ffff;
  box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
}
input::placeholder { color: rgba(0, 255, 255, 0.4); }

/* Buttons - Efek Neon Nyala ala LoL Hextech */
button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: 1px solid #00ffff;
  background: transparent;
  color: #00ffff;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  border-radius: 0;
}
button:hover {
  background-color: #00ffff;
  color: #050509;
  box-shadow: 0 0 20px #00ffff, 0 0 40px rgba(0, 255, 255, 0.6);
}
/* Efek kilauan saat di-hover */
button::after {
  content: '';
  position: absolute;
  top: -50%; left: -50%; width: 200%; height: 200%;
  background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: rotate(45deg);
  transition: all 0.5s;
  opacity: 0;
}
button:hover::after { opacity: 1; left: 100%; }

button.secondary {
  border-color: #ff00ff; /* Magenta Neon (Zaun) */
  color: #ff00ff;
}
button.secondary:hover {
  background-color: #ff00ff;
  color: #050509;
  box-shadow: 0 0 20px #ff00ff, 0 0 40px rgba(255, 0, 255, 0.6);
}
button.danger { 
  border-color: #ff3333; 
  color: #ff3333;
}
button.danger:hover {
  background-color: #ff3333;
  color: white;
  box-shadow: 0 0 20px #ff3333;
}

/* Grid Stats */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}
.stat {
  background: rgba(10, 15, 25, 0.8);
  padding: 18px;
  border: 1px solid #1a2a4a;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  position: relative;
}
/* Indikator sudut neon kecil */
.stat::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 10px; height: 10px;
  border-top: 2px solid #00ffff;
  border-left: 2px solid #00ffff;
}
.stat strong {
  display: block;
  font-size: 28px;
  margin-top: 10px;
  color: #ffcc00; /* Kuning Emas Aktif */
  font-family: 'Courier New', Courier, monospace; /* Font data kaku */
  text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
  overflow-wrap: anywhere;
}
.small {
  font-size: 13px;
  color: #8da1b3; /* Cyan abu-abu */
}

/* Tabel - Cyberpunk HUD style */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  background-color: rgba(10, 15, 25, 0.6);
}
th, td {
  padding: 12px 10px;
  border-bottom: 1px solid #1a2a4a;
  text-align: left;
  font-size: 14px;
  overflow-wrap: anywhere;
  vertical-align: middle;
}
th {
  color: #00ffff;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 900;
  background-color: rgba(26, 42, 74, 0.4);
}
/* Efek highlight baris saat hover */
tr:hover td {
  background-color: rgba(0, 255, 255, 0.05);
  color: white;
}

.table-wrap { overflow-x: auto; border: 1px solid #1a2a4a; }

/* Gambar Produk */
.product-img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 0; /* Tajam */
  border: 2px solid #1a2a4a;
  transition: border-color 0.3s;
}
tr:hover .product-img { border-color: #00ffff; }

.no-img {
  width: 48px; height: 48px;
  border: 1px solid #1a2a4a;
  color: #8da1b3;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: bold; text-transform: uppercase;
}

[hidden] { display: none !important; }

/* Login Status text */
#loginStatus {
  font-weight: bold;
  margin-top: 15px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Media Queries */
@media (max-width: 420px) {
  main { padding: 12px; }
  header h2 { font-size: 18px; }
  .grid { gap: 10px; }
  .stat strong { font-size: 24px; }
  th, td { padding: 8px 5px; font-size: 12px; }
}
</style>
</head>
<body>
<header>
  <div>
    <h2>ID40 :: HEXTECH HUD</h2>
    <p>Sistem Pemantauan Stok [Sesi: Aktif]</p>
  </div>
  <!-- Tambahan dekorasi kanan ala HUD game -->
  <div class="small" style="text-align: right; text-transform: uppercase; letter-spacing: 1px;">
    System Status: <span style="color: #00ff00; text-shadow: 0 0 5px #00ff00;">ONLINE</span><br>
    Ver: 2.1.0
  </div>
</header>
<main>
  <section id="loginCard" class="card">
    <h3>> Akses Protokol</h3>
    <p class="small">Inisialisasi otentikasi pengguna.</p>
    <form id="loginForm">
      <label for="email">Identitas (Email)</label>
      <input id="email" type="email" required autocomplete="username" placeholder="user@id40.io">
      <label for="password">Kode Akses (Kata sandi)</label>
      <input id="password" type="password" required autocomplete="current-password" placeholder="******">
      <button type="submit">Otorisasi</button>
    </form>
    <p id="loginStatus" role="status"></p>
  </section>
  <section id="dashboard" hidden>
    <div class="card">
      <h3 id="welcome">> Console Dashboard</h3>
      <p id="userInfo" class="small"></p>
      <div class="grid" style="margin-top: 15px;">
        <button id="refreshBtn">Sinkronisasi Data</button>
        <button id="logoutBtn" class="secondary">Terminasi Sesi</button>
      </div>
    </div>
    <div class="card">
      <h3>> Matriks Ringkasan</h3>
      <div class="grid">
        <div class="stat">
          <span class="small uppercase">Total Unit Produk</span>
          <strong id="productTotal">—</strong>
        </div>
        <div class="stat">
          <span class="small uppercase">Sesi SO Aktif</span>
          <strong id="sessionTotal">—</strong>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>> Database Barang</h3>
      <input id="productSearch" type="search" placeholder="Cari barcode atau nama unit...">
      <button id="searchBtn">Pindai Database</button>
      <p id="productStatus" class="small"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Visual</th>
              <th>Barcode</th>
              <th>Nama Unit</th>
              <th>Kategori</th>
              <th>Harga Unit</th>
              <th>Stok HUD</th>
            </tr>
          </thead>
          <tbody id="productRows"></tbody>
        </table>
      </div>
    </div>
    <!-- Bagian lain tetap, hanya CSS yang berubah -->
  </section>
</main>
<script type="module">
// ... KODE JAVASCRIPT ANDA TETAP SAMA, TIDAK ADA PERUBAHAN ...
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://zfxewmzsvmzxrfqbkmre.supabase.co';
const SUPABASE_KEY = 'sb_publishable_thVM_xwRc90C7MYlpIxX2w__FiG5RA1';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let currentUser = null;
let currentProfile = null;

function showMessage(id, message) {
  $(id).textContent = message;
}

async function loadDashboard() {
  showMessage('productStatus', 'Memuat data produk...');
  showMessage('sessionStatus', 'Memuat sesi SO...');
  const [productsResult, sessionsResult] = await Promise.all([
    supabase
      .from('products')
      .select('id', { count: 'exact', head: true }),
    supabase
      .from('so_sessions')
      .select('id, session_name, status, created_at')
      .order('created_at', { ascending: false })
      .limit(50)
  ]);
  
  if (productsResult.error) {
    $('productTotal').textContent = '!';
    showMessage('productStatus', 'Gagal membaca produk: ' + productsResult.error.message);
  } else {
    $('productTotal').textContent = productsResult.count ?? 0;
    showMessage('productStatus', 'Data produk siap.');
  }

  if (sessionsResult.error) {
    $('sessionTotal').textContent = '!';
    showMessage('sessionStatus', 'Gagal membaca sesi: ' + sessionsResult.error.message);
  } else {
    const sessions = sessionsResult.data ?? [];
    $('sessionTotal').textContent = sessions.filter(s => s.status === 'active').length;
    renderSessions(sessions);
    showMessage('sessionStatus', 'Data sesi berhasil dimuat.');
  }
}

function renderSessions(sessions) {
  const container = $('sessionList');
  container.replaceChildren();
  if (!sessions.length) {
    container.textContent = 'Belum ada sesi SO.';
    return;
  }
  sessions.forEach(session => {
    const item = document.createElement('div');
    item.className = 'stat';
    item.style.marginBottom = '10px';
    const title = document.createElement('strong');
    title.style.fontSize = '16px';
    title.textContent = session.session_name || 'Sesi tanpa nama';
    const status = document.createElement('p');
    status.textContent = 'Status: ' + session.status;
    item.append(title, status);
    container.appendChild(item);
  });
}

async function searchProducts() {
  const term = $('productSearch').value.trim();
  const rows = $('productRows');
  rows.replaceChildren();
  
  // Mengambil kolom image_url (atau image_path) dari tabel products
  let query = supabase
    .from('products')
    .select('barcode, product_name, category, price, system_stock, image_url')
    .order('product_name')
    .limit(100);
    
  if (term) {
    const safeTerm = term.replace(/[,%()]/g, '');
    query = query.or(`barcode.eq.${safeTerm},product_name.ilike.%${safeTerm}%`);
  }
  
  const { data, error } = await query;
  if (error) {
    showMessage('productStatus', 'Gagal mencari barang: ' + error.message);
    return;
  }
  if (!data.length) {
    showMessage('productStatus', 'Barang tidak ditemukan.');
    return;
  }
  
  data.forEach(product => {
    const row = document.createElement('tr');
    
    // 1. Kolom Gambar
    const imgCell = document.createElement('td');
    const imageUrl = product.image_url || product.image_path; 
    if (imageUrl) {
      const img = document.createElement('img');
      img.src = imageUrl;
      img.alt = product.product_name || 'Produk';
      img.className = 'product-img';
      imgCell.appendChild(img);
    } else {
      imgCell.innerHTML = '<div class="no-img">No Img</div>';
    }
    row.appendChild(imgCell);

    // Format harga
    const formattedPrice = product.price != null 
      ? 'Rp ' + Number(product.price).toLocaleString('id-ID') 
      : '—';

    // 2-6. Kolom Text Data
    const textValues = [
      product.barcode, 
      product.product_name, 
      product.category, 
      formattedPrice, 
      product.system_stock
    ];

    textValues.forEach(value => {
      const cell = document.createElement('td');
      cell.textContent = value == null ? '—' : String(value);
      row.appendChild(cell);
    });

    rows.appendChild(row);
  });
  
  showMessage('productStatus', `Menampilkan ${data.length} barang (maksimal 100).`);
}

// ... SISA JAVASCRIPT ANDA TETAP SAMA ...
async function login(event) {
  event.preventDefault();
  showMessage('loginStatus', 'Memeriksa otorisasi...');
  const email = $('email').value.trim();
  const password = $('password').value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    showMessage('loginStatus', 'Login gagal: ' + error.message);
    return;
  }
  const { data: profile, error: profileError } = await supabase
    .from('profiles')
    .select('full_name, role')
    .eq('id', data.user.id)
    .maybeSingle();
    
  if (profileError || !profile) {
    await supabase.auth.signOut();
    showMessage('loginStatus', 'Profil tidak dapat diakses. Hubungi supervisor.');
    return;
  }
  currentUser = data.user;
  currentProfile = profile;
  $('loginCard').hidden = true;
  $('dashboard').hidden = false;
  $('welcome').textContent = '> Akses Diterima: ' + (profile.full_name \vert{}\vert{} 'Operator') + '!';$('userInfo').textContent = 'ID: ' + data.user.email + ' | Otoritas: ' + profile.role;
  $('supervisorNotice').hidden = profile.role !== 'supervisor';
  await loadDashboard();
}

async function logout() {
  const { error } = await supabase.auth.signOut();
  if (error) {
    alert('Logout gagal: ' + error.message);
    return;
  }
  currentUser = null;
  currentProfile = null;
  $('dashboard').hidden = true;
  $('loginCard').hidden = false;
  $('loginForm').reset();
  showMessage('loginStatus', 'Sesi terminasi.');
}

$('loginForm').addEventListener('submit', login);
$('logoutBtn').addEventListener('click', logout);$('refreshBtn').addEventListener('click', loadDashboard);
$('searchBtn').addEventListener('click', searchProducts);$('productSearch').addEventListener('keydown', event => {
  if (event.key === 'Enter') searchProducts();
});

const { data: sessionData } = await supabase.auth.getSession();
if (sessionData.session) {
  const user = sessionData.session.user;
  const { data: profile, error } = await supabase
    .from('profiles')
    .select('full_name, role')
    .eq('id', user.id)
    .maybeSingle();
  if (!error && profile) {
    currentUser = user;
    currentProfile = profile;
    $('loginCard').hidden = true;
    $('dashboard').hidden = false;
    $('welcome').textContent = '> Akses Diterima: ' + (profile.full_name \vert{}\vert{} 'Operator') + '!';$('userInfo').textContent = 'ID: ' + user.email + ' | Otoritas: ' + profile.role;
    $('supervisorNotice').hidden = profile.role !== 'supervisor';
    await loadDashboard();
  }
}
</script>
</body>
</html>
