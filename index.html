<!DOCTYPE html>
<html lang="id">
<head>

<title>ID40 Stock Opname</title>
<style>

  padding: 24px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 3px 12px #ddd;

h2 { color: #176b45; }

  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 8px;
}
input { border: 1px solid #ccc; }
button {
  background: #176b45;
  color: white;
  border: none;
  font-size: 16px;
}
</style>
</head>

<div class="card">
  <h2>ID40 Stock Opname</h2>
  <p>Aplikasi penghitungan stok toko</p>
  <label>Email karyawan</label>

  <label>Kata sandi</label>
  <input type="password" placeholder="Masukkan kata sandi">
  <button onclick="alert('Tampilan awal berhasil dibuat!')">
    Login
  </button>

</body>
</html>
